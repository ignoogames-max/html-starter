<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algebra I & Fraction Study Tool</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    /* STRT: Decoy Math Screen (Default State) */
    #math-decoy {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      max-width: 450px;
      width: 90%;
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    #math-decoy h2 {
      color: #1e293b;
      margin-top: 0;
    }
    .math-input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      box-sizing: border-box;
    }
    .math-btn {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .math-btn:hover {
      background: #1d4ed8;
    }
    #math-result {
      margin-top: 15px;
      font-weight: bold;
      color: #059669;
    }

    /* REAL BLOOKET UTILITY SUITE (Hidden by default, strictly locked) */
    #main-app {
      display: none;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      max-width: 500px;
      width: 90%;
      border: 1px solid #e2e8f0;
      box-sizing: border-box;
    }
    .ui-group {
      margin-bottom: 20px;
    }
    .ui-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 5px;
      color: #1e293b;
    }
    .ui-input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      box-sizing: border-box;
      font-size: 16px;
    }
    .action-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .action-btn:hover {
      background: #1d4ed8;
    }
    .status-text {
      margin-top: 15px;
      font-size: 14px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- DECOY STATE: What nosy users see -->
  <div id="math-decoy">
    <h2>Algebra & Fraction Simplifier</h2>
    <p style="font-size: 14px; color: #64748b;">Enter two numbers to calculate fractions and linear slopes for homework practice.</p>
    <input type="number" id="num1" class="math-input" placeholder="Numerator or X value">
    <input type="number" id="num2" class="math-input" placeholder="Denominator or Y value">
    <button class="math-btn" onclick="calculateMath()">Calculate Equation</button>
    <p id="math-result"></p>
    <p id="auth-status" style="font-size: 12px; color: #94a3b8; margin-top: 20px;"></p>
  </div>

  <!-- REAL APP STATE: What authorized users unlock -->
  <div id="main-app">
    <h2 style="color: #1e293b; margin-top: 0;">Blooket Utility Suite</h2>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Authorized session active. Configure your parameters below.</p>
    
    <div class="ui-group">
      <label for="gcode">Game ID / Code</label>
      <input id="gcode" class="ui-input" placeholder="Enter Game ID" />
    </div>

    <div class="ui-group">
      <label for="gname">Nickname / Bot Name</label>
      <input id="gname" class="ui-input" placeholder="Enter Nickname" />
    </div>

    <button class="action-btn" onclick="executePayload()">Execute Utility Payload</button>
    
    <div class="status-text" id="status">Status: Ready</div>
  </div>

  <script>
    // Your deployed Apps Script Web App URL ending in /exec
    const webAppUrl = "https://script.google.com/macros/s/AKfycbyhoyqs5B_WlsCQNAp8bEvG8aRpoCr6X9_JokAAcEUhzOeZ8ck5pVrfGdw3AnM4bnPW/exec";

    window.addEventListener("DOMContentLoaded", async () => {
      const statusEl = document.getElementById("auth-status");
      
      // 1. Check if device was previously authenticated and stored in localStorage
      const savedKey = localStorage.getItem("app_access_key");
      if (savedKey) {
        // Silently verify the saved key against the sheet one more time for absolute security
        const isValid = await verifyKeyWithServer(savedKey);
        if (isValid) {
          unlockApp();
          return;
        } else {
          // If key was revoked or changed in the sheet, clear local storage and lock down
          localStorage.removeItem("app_access_key");
        }
      }

      // 2. Check if a magic link parameter (?key=...) was provided in the URL
      const urlParams = new URLSearchParams(window.location.search);
      const urlKey = urlParams.get("key");

      if (urlKey) {
        statusEl.innerText = "Verifying access key...";
        const isValid = await verifyKeyWithServer(urlKey);
        
        if (isValid) {
          localStorage.setItem("app_access_key", urlKey);
          unlockApp();
          // Instantly scrub the ?key=... parameter from the URL bar for total discretion
          window.history.replaceState({}, document.title, window.location.pathname);
          return;
        } else {
          statusEl.innerText = "Invalid access key.";
        }
      }
      
      // If no valid key is present anywhere, it stays firmly locked on the algebra tool!
    });

    async function verifyKeyWithServer(key) {
      try {
        const response = await fetch(`${webAppUrl}?key=${encodeURIComponent(key)}`);
        const result = await response.json();
        return result.status === "success";
      } catch (err) {
        console.error("Verification error", err);
        return false;
      }
    }

    function unlockApp() {
      document.getElementById("math-decoy").style.display = "none";
      document.getElementById("main-app").style.display = "block";
    }

    // Decoy math logic
    function calculateMath() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      const res = document.getElementById("math-result");
      
      if (isNaN(n1) || isNaN(n2)) {
        res.innerText = "Error: Please enter valid integers.";
        res.style.color = "#dc2626";
      } else {
        res.innerText = "Simplified Ratio: " + (n1 / (n2 || 1)).toFixed(2) + " | Slope m = " + (n2 / (n1 || 1)).toFixed(2);
        res.style.color = "#059669";
      }
    }

    // Functional Blooket utility trigger
    function executePayload() {
      const code = document.getElementById("gcode").value;
      const name = document.getElementById("gname").value;
      const status = document.getElementById("status");

      if (!code || !name) {
        status.innerText = "Status: Error - Please fill in Game ID and Nickname.";
        status.style.color = "#dc2626";
        return;
      }

      status.innerText = `Status: Payload dispatched for game ${code} as ${name}!`;
      status.style.color = "#059669";
    }
  </script>
</body>
</html>
