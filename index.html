  <script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbw8B3cPM6TRvGZe7Hgc-MTDWBsLiFUnx79IeymJR1UEVmlSNeKuFcRjRDW8k5CrcrMV/exec";

    window.addEventListener("DOMContentLoaded", async () => {
      const savedKey = localStorage.getItem("app_access_key");
      if (savedKey) {
        unlockAppInterface();
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const urlKey = urlParams.get("key");

      if (urlKey) {
        await verifyAndUnlock(urlKey);
      }
    });

    async function verifyAndUnlock(key) {
      try {
        const response = await fetch(webAppUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ key: key }),
        });

        const result = await response.json();

        if (result.status === "success") {
          localStorage.setItem("app_access_key", key);
          unlockAppInterface();
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      } catch (err) {
        // Silenced error output for privacy
      }
    }

    function unlockAppInterface() {
      const decoy = document.getElementById("math-decoy-container");
      if (decoy) {
        decoy.style.display = "none";
      }
    }

    function calculateMath() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      const res = document.getElementById("math-result");
      
      if (isNaN(n1) || isNaN(n2)) {
        res.innerText = "Error: Please enter valid integers.";
        res.style.color = "#dc2626";
      } else {
        res.innerText = "Simplified Ratio: " + (n1 / (n2 || 1)).toFixed(2) + " | Slope m = " + (n2 / (n1 || 1)).toFixed(2);
        res.style.color = "#059669";
      }
    }

    }
  </script>
